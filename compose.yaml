services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8081}"
      FEED_URL: "${FEED_URL:-https://tminasen.dev/rss/feed.xml}"
      CRAWL_INTERVAL_MINUTES: "${CRAWL_INTERVAL_MINUTES:-30}"
      REPOSITORY: "${REPOSITORY:-sqlite}"
      DATABASE_PATH: "/data/rss_reader.db"
    volumes:
      - rss_reader_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "8081:8081"
    depends_on:
      server:
        condition: service_healthy

volumes:
  rss_reader_data:
